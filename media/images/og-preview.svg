<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;900&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f8f7f4"/>

  <!-- Orange left accent bar -->
  <rect x="80" y="100" width="6" height="430" fill="#f97316" rx="3"/>

  <!-- Decorative big "01" -->
  <text x="920" y="480" font-family="Arial Black, sans-serif" font-weight="900"
        font-size="340" fill="#111111" opacity="0.04" letter-spacing="-20">01</text>

  <!-- Label -->
  <text x="112" y="158" font-family="Arial, sans-serif" font-weight="700"
        font-size="22" fill="#f97316" letter-spacing="4">SELAMAT DATANG DI WEB SAYA</text>

  <!-- Main heading line 1 -->
  <text x="112" y="280" font-family="Arial Black, sans-serif" font-weight="900"
        font-size="110" fill="#111111" letter-spacing="-4">Halo, kamu</text>

  <!-- Main heading line 2 - orange -->
  <text x="112" y="400" font-family="Arial Black, sans-serif" font-weight="900"
        font-size="110" fill="#f97316" letter-spacing="-4">nyasar di sini.</text>

  <!-- Divider line -->
  <rect x="112" y="440" width="60" height="4" fill="#f97316" rx="2"/>

  <!-- Subtext -->
  <text x="112" y="490" font-family="Arial, sans-serif" font-weight="400"
        font-size="26" fill="#888888">Klik jika berani. Dijamin 100% aman.</text>

  <!-- Bottom URL -->
  <text x="112" y="570" font-family="Arial, sans-serif" font-weight="700"
        font-size="22" fill="#cccccc" letter-spacing="1">lamanunikku.netlify.app</text>

  <!-- Bottom right dot decoration -->
  <circle cx="1100" cy="570" r="8" fill="#f97316"/>
  <circle cx="1130" cy="570" r="8" fill="#f97316" opacity="0.4"/>
  <circle cx="1160" cy="570" r="8" fill="#f97316" opacity="0.15"/>
</svg>
